<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Example</title>
    <style>
        .slot-container-1-up .v-14 .inner-container .text-container {
            width: 37rem;
            max-height: 14rem;
        }
    </style>
</head>
<body>
    <div class="slot-container-1-up">
        <div class="v-14">
            <div class="inner-container">
                <div class="text-container">
                    <!-- Content goes here -->
                    <p>This is some text inside the text-container div.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
